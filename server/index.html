<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomePulse</title>
<style>
:root{--bg:#0e1117;--card:#161b22;--line:#262d38;--text:#e6edf3;--dim:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
#sum{color:var(--dim)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card.off{opacity:.55}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.name{font-weight:600;font-size:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.row{margin:8px 0}
.lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
#modal{display:none;position:fixed;inset:0;background:#000a;padding:24px;overflow:auto}
#box{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
#box h2{margin:0 0 4px}
.close{float:right;cursor:pointer;color:var(--dim)}
.chart{margin:14px 0}
svg{width:100%;height:90px;background:var(--bg);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px}
</style>
</head>
<body>
<header><h1>HomePulse</h1><span id="sum"></span></header>
<div id="grid"></div>
<div id="modal"><div id="box"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=(v,w=70,b=90)=>v>=b?'var(--bad)':v>=w?'var(--warn)':'var(--ok)';
const gb=b=>(b/1073741824).toFixed(1)+' GB';
const rate=b=>b>1048576?(b/1048576).toFixed(1)+' MB/s':(b/1024).toFixed(0)+' KB/s';
const up=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+h+'h '+m+'m'};
const maxTemp=t=>{const v=Object.values(t||{});return v.length?Math.max(...v):null};
const bar=(label,val,txt)=>`<div class="row"><div class="lab"><span>${label}</span><span>${txt}</span></div><div class="bar"><i style="width:${Math.min(val,100)}%;background:${col(val)}"></i></div></div>`;
let data=[],current=null,mins=60;

function render(){
  const on=data.filter(s=>s.online).length;
  $('#sum').textContent=`${on} / ${data.length} online`;
  $('#grid').innerHTML=data.map(s=>{
    const t=maxTemp(s.temps);
    return `<div class="card ${s.online?'':'off'}" data-n="${esc(s.hostname)}">
      <div class="top"><span class="name"><span class="dot" style="background:${s.online?'var(--ok)':'var(--bad)'}"></span>${esc(s.hostname)}</span>
      <span class="sub">${s.online?'online':'offline '+s.age+'s'}</span></div>
      <div class="sub">${esc(s.ip)} · ${esc(s.os)} · up ${up(s.uptime)}</div>
      ${bar('CPU',s.cpu_percent,s.cpu_percent.toFixed(0)+'%')}
      ${bar('RAM',s.mem.percent,s.mem.percent.toFixed(0)+'%')}
      <div class="chips">
        ${t!==null?`<span class="chip" style="color:${col(t,65,80)}">${t.toFixed(0)}°C</span>`:''}
        <span class="chip">load ${s.load.map(x=>x.toFixed(2)).join(' ')}</span>
        <span class="chip">↓ ${rate(s.net.rx_bps)} ↑ ${rate(s.net.tx_bps)}</span>
      </div></div>`}).join('')||'<p style="color:var(--dim)">Brak serwerów. Zainstaluj agenta (komenda w README).</p>';
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>open_(c.dataset.n));
  if(current)detail();
}
function spark(pts,key,max,color,label,unit){
  const v=pts.filter(p=>p[key]!==null);
  if(v.length<2)return `<div class="chart"><div class="lab"><span>${label}</span><span>brak danych</span></div></div>`;
  const t0=v[0].ts,t1=v[v.length-1].ts,top=max||Math.max(...v.map(p=>p[key]),1);
  const d=v.map(p=>`${((p.ts-t0)/(t1-t0)*600).toFixed(1)},${(78-(p[key]/top)*74).toFixed(1)}`).join(' ');
  return `<div class="chart"><div class="lab"><span>${label}</span><span>teraz ${v[v.length-1][key].toFixed(1)}${unit}</span></div>
  <svg viewBox="0 0 600 80" preserveAspectRatio="none"><polyline points="${d}" fill="none" stroke="${color}" stroke-width="1.6"/></svg></div>`;
}
let hist=[];
function detail(){
  const s=data.find(x=>x.hostname===current);if(!s)return;
  $('#box').innerHTML=`<span class="close" onclick="current=null;$('#modal').style.display='none'">✕ zamknij</span>
  <h2>${esc(s.hostname)}</h2><div class="sub">${esc(s.ip)} · ${esc(s.os)} · ${s.cpu_count} rdzeni · up ${up(s.uptime)}</div>
  <select onchange="mins=+this.value;loadHist()">${[[15,'15 min'],[60,'1 godz.'],[360,'6 godz.'],[1440,'24 godz.'],[10080,'7 dni']].map(([m,l])=>`<option value="${m}" ${m===mins?'selected':''}>${l}</option>`).join('')}</select>
  ${spark(hist,'cpu',100,'var(--acc)','CPU','%')}${spark(hist,'mem',100,'var(--ok)','RAM','%')}${spark(hist,'temp',null,'var(--warn)','Temperatura','°C')}
  <h3>Temperatury</h3><table>${Object.entries(s.temps||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}°C</td></tr>`).join('')||'<tr><td>brak czujników</td></tr>'}</table>
  <h3>Dyski</h3>${s.disks.map(d=>bar(esc(d.mount),d.percent,gb(d.used)+' / '+gb(d.total))).join('')}
  <h3>Top procesy</h3><table><tr><th>Proces</th><th>CPU</th><th>RAM</th></tr>${s.procs.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.cpu}%</td><td>${p.mem}%</td></tr>`).join('')}</table>`;
}
async function loadHist(){hist=await (await fetch(`/api/history/${encodeURIComponent(current)}?minutes=${mins}`)).json();detail()}
function open_(n){current=n;$('#modal').style.display='block';loadHist()}
async function tick(){try{data=await (await fetch('/api/servers')).json();render()}catch(e){}}
tick();setInterval(tick,3000);
setInterval(()=>{if(current)loadHist()},15000);
</script>
</body>
</html>
